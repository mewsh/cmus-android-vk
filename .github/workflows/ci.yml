name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses; ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager 'cmake;3.30.5' 'ndk;28.2.13676358' 'build-tools;36.0.0'
      - run: ./patch.sh
      - name: Build signed APK
        run: |
          ./gradlew app:assembleDebug
          BUILD_TOOLS=$(ls ${ANDROID_SDK_ROOT}/build-tools | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          ${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/zipalign -f 4 "$APK" app-debug-aligned.apk
          ${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner sign \
            --ks keystore/cmusvk.jks --ks-pass pass:cmusvk123 \
            --key-pass pass:cmusvk123 --ks-key-alias cmusvk \
            --out app-debug-signed.apk app-debug-aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-debug-signed.apk
      - name: Publish to latest release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=latest
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "cmusVK (latest)" --notes "Авто-сборка из master" --prerelease
          gh release upload "$TAG" app-debug-signed.apk --clobber
