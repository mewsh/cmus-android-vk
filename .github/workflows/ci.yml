name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses; ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager 'cmake;3.30.5' 'ndk;28.2.13676358' 'build-tools;36.0.0'
      - run: ./patch.sh
      - run: ./gradlew app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish to latest release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=latest
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "cmusVK (latest)" --notes "Авто-сборка из master. Скачать APK: app-debug.apk" --prerelease
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber
